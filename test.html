<!DOCTYPE html>
<html lang="ja" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Total Beauty Salon LUVIA（ルヴィア）｜愛知県稲沢市の完全都度払いプライベートサロン</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 美しい明朝体を読み込み -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;500&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        beige: {
                            50: '#faf9f7', // わずかに温かみのある白（背景）
                            100: '#f0ede6',
                            200: '#e5decb',
                        },
                        accent: {
                            DEFAULT: '#b39564', // 上品なシャンパンゴールド
                        }
                    },
                    fontFamily: {
                        // メインを明朝体に設定
                        serif: ['"Noto Serif JP"', 'serif'],
                        sans: ['"Hiragino Sans"', '"Hiragino Kaku Gothic ProN"', 'Meiryo', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Noto Serif JP', serif; }
        .fade-in-up { animation: fadeInUp 1.2s ease-out forwards; }
        @keyframes fadeInUp {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-beige-50 text-gray-800 antialiased overflow-x-hidden selection:bg-accent selection:text-white">

    <!-- ヘッダー（背景を透明にし、スクロールで白くなるようにするのもおすすめですが、今回はシンプルに） -->
    <header class="fixed top-0 left-0 w-full bg-beige-50/90 backdrop-blur-sm z-50">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <a href="#" class="text-3xl font-serif tracking-[0.2em] text-gray-900">LUVIA</a>
            <!-- ハンバーガーメニュー等は省略（必要に応じて追加） -->
        </div>
    </header>

    <!-- ファーストビュー（FV） - アシンメトリーな雑誌風レイアウト -->
    <section class="relative w-full min-h-screen flex items-center pt-20">
        <!-- 意図的に右側に配置したメイン画像（少し横幅を狭めて余白を作る） -->
        <div class="absolute right-0 top-0 w-[85%] md:w-[65%] h-full z-0 fade-in-up" style="animation-delay: 0.2s;">
            <div class="w-full h-full relative">
                <!-- imgタグの src に今の画像パスを入れています -->
                <img src="./1792408170964.jpg?v=final" alt="LUVIA サロン外観" class="w-full h-full object-cover filter brightness-[0.85]">
                <!-- 画像に薄いベールをかけて文字を見やすくする -->
                <div class="absolute inset-0 bg-gradient-to-l from-transparent to-beige-50"></div>
            </div>
        </div>

        <!-- 左側に被せるテキストエリア -->
        <div class="relative z-10 w-full max-w-7xl mx-auto px-6 lg:px-12 flex flex-col items-start mt-12 md:mt-0 fade-in-up">
            
            <span class="inline-block py-1.5 px-4 mb-6 border border-gray-300 text-gray-600 text-xs tracking-[0.2em] uppercase bg-white/80 backdrop-blur-sm">
                愛知県稲沢市｜完全予約制サロン
            </span>

            <p class="text-lg md:text-xl tracking-[0.3em] text-gray-700 mb-4 font-light">自分を、もっと好きになれる場所。</p>
            
            <h1 class="text-4xl md:text-6xl lg:text-7xl font-medium leading-[1.3] tracking-widest text-gray-900 mb-10">
                美しさを、<br>もっと自由に。
            </h1>

            <!-- 雑誌のリード文のような配置 -->
            <div class="bg-white/90 backdrop-blur-md p-8 md:p-10 shadow-sm max-w-lg border-l-2 border-accent">
                <p class="text-sm md:text-base text-gray-700 leading-loose font-light">
                    高額ローンや回数券の勧誘は<br class="hidden md:block">一切ございません。<br><br>
                    プロ専任施術による<strong class="font-medium text-accent">完全都度払い</strong>。<br>
                    「通いたい時に、受けた分だけ支払う」<br class="hidden md:block">
                    妥協のない本格美容体験をお約束します。
                </p>
            </div>

            <!-- 初回限定オファー（さりげなく） -->
            <div class="mt-12 flex flex-col sm:flex-row items-center gap-6">
                <div class="text-center sm:text-left">
                    <p class="text-xs text-accent tracking-widest mb-1">FIRST VISIT OFFER</p>
                    <p class="text-sm text-gray-600">セルフホワイトニング照射</p>
                    <p class="text-3xl font-medium text-gray-900 mt-1">¥980 <span class="text-xs text-gray-500">(税込)</span></p>
                </div>
                <!-- 予約ボタン（LINEグリーン） -->
                <a href="https://lin.ee/tum8tUo" target="_blank" rel="noopener noreferrer" class="bg-[#06C755] hover:bg-[#05b34c] text-white font-sans font-bold text-sm tracking-widest py-4 px-10 rounded-sm shadow-md transition duration-300 flex items-center justify-center gap-2">
                    <i class="fa-brands fa-line text-lg"></i>
                    公式LINEで予約する
                </a>
            </div>

        </div>
    </section>

</body>
</html>
